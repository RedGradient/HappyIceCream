<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Happy Ice Cream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #c8f0f4;
            --bg-mid: #ffe8f0;
            --bg-bottom: #fff3d6;
            --ink: #1a2b33;
            --muted: #4a606a;
            --accent: #ff5c7a;
            --accent-deep: #e83d5f;
            --field: rgba(255, 255, 255, 0.78);
            --ring: rgba(26, 43, 51, 0.14);
            --shadow: 0 18px 40px rgba(26, 43, 51, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse 80% 50% at 15% 20%, rgba(255, 255, 255, 0.55), transparent 55%),
                radial-gradient(ellipse 70% 45% at 85% 75%, rgba(255, 92, 122, 0.18), transparent 50%),
                linear-gradient(165deg, var(--bg-top), var(--bg-mid) 48%, var(--bg-bottom));
            overflow: hidden;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.55;
            pointer-events: none;
            animation: drift 14s ease-in-out infinite alternate;
        }

        .blob-a {
            width: 28rem;
            height: 28rem;
            background: #9fe7ef;
            top: -8rem;
            left: -6rem;
        }

        .blob-b {
            width: 22rem;
            height: 22rem;
            background: #ffb4c4;
            right: -5rem;
            bottom: -4rem;
            animation-delay: -4s;
        }

        .hero {
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            text-align: center;
        }

        .hero-inner {
            width: min(100%, 34rem);
            animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .brand {
            margin: 0;
            font-family: Sora, sans-serif;
            font-weight: 800;
            font-size: clamp(2.4rem, 8vw, 4.2rem);
            letter-spacing: -0.04em;
            line-height: 0.95;
        }

        .tagline {
            margin: 0.85rem 0 1.75rem;
            color: var(--muted);
            font-size: clamp(1rem, 2.5vw, 1.15rem);
            line-height: 1.45;
        }

        .promo-form {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 0.65rem;
            width: 100%;
        }

        .promo-form input {
            flex: 1 1 auto;
            min-width: 0;
            width: 12ch;
            max-width: 14rem;
            height: 3.25rem;
            padding: 0 0.95rem;
            border: 1px solid var(--ring);
            border-radius: 0.85rem;
            background: var(--field);
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow);
            color: var(--ink);
            font-family: Sora, sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.28em;
            text-align: center;
            text-transform: uppercase;
            outline: none;
            transition: border-color 180ms ease, transform 180ms ease;
        }

        .promo-form input::placeholder {
            letter-spacing: 0.18em;
            color: #8aa0aa;
            text-transform: none;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .promo-form input:focus {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .promo-form button {
            flex: 0 0 auto;
            height: 3.25rem;
            padding: 0 1.25rem;
            border: 0;
            border-radius: 0.85rem;
            background: var(--accent);
            color: #fff;
            font-family: Sora, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: background 160ms ease, transform 160ms ease;
        }

        .promo-form button:hover {
            background: var(--accent-deep);
            transform: translateY(-1px);
        }

        .promo-form button:active {
            transform: translateY(0);
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(1.25rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(1.5rem, 1rem) scale(1.06); }
        }

        @media (max-width: 480px) {
            .promo-form {
                flex-direction: column;
                align-items: stretch;
            }

            .promo-form input {
                max-width: none;
                width: 100%;
            }

            .promo-form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>

    <main class="hero">
        <div class="hero-inner">
            <h1 class="brand">Happy Ice Cream</h1>
            <p class="tagline">Введите промокод для участия в розыгрыше!</p>

            <form class="promo-form" id="promo-form">
                {% csrf_token %}
                <label class="visually-hidden" for="promo-code">Промокод</label>
                <input
                    id="promo-code"
                    name="code"
                    type="text"
                    maxlength="8"
                    minlength="8"
                    pattern="([A-Z]{8}|[0-9]{8})"
                    inputmode="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="8 символов"
                    required
                >
                <button type="submit">Отправить</button>
            </form>
        </div>
    </main>

    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    <script>
        const form = document.getElementById('promo-form');
        const input = document.getElementById('promo-code');
        const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const code = input.value.trim().toUpperCase();

            const response = await fetch('/promocode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({ code }),
            });

            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                console.error(error);
                return;
            }

            await response.json();
        });
    </script>
</body>
</html>
