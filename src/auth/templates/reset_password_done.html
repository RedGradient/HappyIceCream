<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пароль обновлён — Happy Ice Cream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #142028;
            --muted: #5a6b73;
            --accent: #ff5c7a;
            --accent-deep: #e83d5f;
            --bg: #e9f1f4;
            --bg-warm: #f4eef0;
            --field: #ffffff;
            --ring: rgba(20, 32, 40, 0.14);
            --danger: #c62828;
            --shadow: 0 1px 2px rgba(20, 32, 40, 0.05), 0 10px 28px rgba(20, 32, 40, 0.06);
            --radius: 0.28rem;
            --radius-lg: 0.4rem;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background:
                linear-gradient(165deg, var(--bg) 0%, #eef3f5 42%, var(--bg-warm) 100%);
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
        }

        .page-inner {
            width: min(100%, 28rem);
            animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
            text-align: center;
        }

        .brand {
            margin: 0;
            font-family: Sora, sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: -0.04em;
            line-height: 0.95;
        }

        .brand a {
            color: inherit;
            text-decoration: none;
        }

        .card {
            margin-top: 1.5rem;
            padding: 1.35rem 1.25rem;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            box-shadow: var(--shadow);
        }

        .card h2 {
            margin: 0 0 0.65rem;
            font-family: Sora, sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .card p {
            margin: 0;
            color: var(--muted);
            font-size: 0.98rem;
            line-height: 1.5;
        }

        .alt-link {
            margin-top: 1.15rem;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .alt-link a {
            color: var(--accent-deep);
            font-weight: 600;
            text-decoration: none;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(1.25rem); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>
    <main class="page">
        <div class="page-inner">
            <h1 class="brand"><a href="{% url 'landing' %}">Happy Ice Cream</a></h1>

            <div class="card">
                <h2>Пароль обновлён</h2>
                <p>Можете войти с новым паролем.</p>
            </div>

            <p class="alt-link"><a href="{% url 'login' %}">Войти</a></p>
        </div>
    </main>
</body>
</html>
