<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ссылка недействительна — Happy Ice Cream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #c8f0f4;
            --bg-mid: #ffe8f0;
            --bg-bottom: #fff3d6;
            --ink: #1a2b33;
            --muted: #4a606a;
            --accent: #ff5c7a;
            --accent-deep: #e83d5f;
            --shadow: 0 18px 40px rgba(26, 43, 51, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(ellipse 80% 50% at 15% 20%, rgba(255, 255, 255, 0.55), transparent 55%),
                radial-gradient(ellipse 70% 45% at 85% 75%, rgba(255, 92, 122, 0.18), transparent 50%),
                linear-gradient(165deg, var(--bg-top), var(--bg-mid) 48%, var(--bg-bottom));
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.55;
            pointer-events: none;
            animation: drift 14s ease-in-out infinite alternate;
        }

        .blob-a {
            width: 28rem;
            height: 28rem;
            background: #9fe7ef;
            top: -8rem;
            left: -6rem;
        }

        .blob-b {
            width: 22rem;
            height: 22rem;
            background: #ffb4c4;
            right: -5rem;
            bottom: -4rem;
            animation-delay: -4s;
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
            text-align: center;
        }

        .page-inner {
            width: min(100%, 28rem);
            animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .brand {
            margin: 0;
            font-family: Sora, sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: -0.04em;
            line-height: 0.95;
        }

        .brand a {
            color: inherit;
            text-decoration: none;
        }

        .title {
            margin: 1.25rem 0 0.65rem;
            font-family: Sora, sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
        }

        .text {
            margin: 0 0 1.5rem;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.65rem;
        }

        .actions a {
            display: inline-block;
            padding: 0.75rem 1.15rem;
            border-radius: 0.85rem;
            font-family: Sora, sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            text-decoration: none;
            transition: background 160ms ease, transform 160ms ease, color 160ms ease;
        }

        .actions .btn-solid {
            color: #fff;
            background: var(--accent);
            box-shadow: var(--shadow);
        }

        .actions .btn-solid:hover {
            background: var(--accent-deep);
            transform: translateY(-1px);
        }

        .actions .btn-ghost {
            color: var(--ink);
            background: rgba(255, 255, 255, 0.55);
        }

        .actions .btn-ghost:hover {
            color: var(--accent-deep);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(1.25rem); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(1.5rem, 1rem) scale(1.06); }
        }
    </style>
</head>
<body>
    <div class="blob blob-a" aria-hidden="true"></div>
    <div class="blob blob-b" aria-hidden="true"></div>

    <main class="page">
        <div class="page-inner">
            <h1 class="brand"><a href="{% url 'landing' %}">Happy Ice Cream</a></h1>
            <h2 class="title">Ссылка недействительна</h2>
            <p class="text">
                Не удалось подтвердить email. Ссылка устарела, уже была использована
                или указана с ошибкой.
            </p>
            <div class="actions">
                <a class="btn-solid" href="{% url 'signup' %}">Зарегистрироваться снова</a>
                <a class="btn-ghost" href="{% url 'login' %}">Войти</a>
            </div>
        </div>
    </main>
</body>
</html>
