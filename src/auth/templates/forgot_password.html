<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Забыли пароль — Happy Ice Cream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #142028;
            --muted: #5a6b73;
            --accent: #ff5c7a;
            --accent-deep: #e83d5f;
            --bg: #e9f1f4;
            --bg-warm: #f4eef0;
            --field: #ffffff;
            --ring: rgba(20, 32, 40, 0.14);
            --danger: #c62828;
            --shadow: 0 1px 2px rgba(20, 32, 40, 0.05), 0 10px 28px rgba(20, 32, 40, 0.06);
            --radius: 0.28rem;
            --radius-lg: 0.4rem;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background:
                linear-gradient(165deg, var(--bg) 0%, #eef3f5 42%, var(--bg-warm) 100%);
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
        }

        .page-inner {
            width: min(100%, 28rem);
            animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .brand {
            margin: 0;
            font-family: Sora, sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: -0.04em;
            line-height: 0.95;
            text-align: center;
        }

        .brand a {
            color: inherit;
            text-decoration: none;
        }

        .tagline {
            margin: 0.75rem 0 0.45rem;
            color: var(--muted);
            font-size: 1.05rem;
            text-align: center;
        }

        .hint {
            margin: 0 0 1.5rem;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.45;
            text-align: center;
        }

        .forgot-form {
            display: grid;
            gap: 0.9rem;
        }

        .field {
            display: grid;
            gap: 0.35rem;
            text-align: left;
        }

        .field label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            height: 3rem;
            padding: 0 0.95rem;
            border: 1px solid var(--ring);
            border-radius: var(--radius);
            background: var(--field);
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow);
            color: var(--ink);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 160ms ease;
        }

        .field input:focus {
            border-color: var(--accent);
        }

        .errorlist {
            margin: 0;
            padding: 0;
            list-style: none;
            color: var(--danger);
            font-size: 0.85rem;
        }

        .forgot-form button {
            margin-top: 0.35rem;
            height: 3.25rem;
            border: 0;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            font-family: Sora, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: background 160ms ease;
        }

        .forgot-form button:hover {
            background: var(--accent-deep);
        }

        .alt-link {
            margin-top: 1rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .alt-link a {
            color: var(--accent-deep);
            font-weight: 600;
            text-decoration: none;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(1.25rem); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>
    <main class="page">
        <div class="page-inner">
            <h1 class="brand"><a href="{% url 'landing' %}">Happy Ice Cream</a></h1>
            <p class="tagline">Забыли пароль?</p>
            <p class="hint">Укажите email — пришлём ссылку для создания нового пароля.</p>

            <form class="forgot-form" method="post" novalidate>
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="non-field-errors">{{ form.non_field_errors }}</div>
                {% endif %}

                <div class="field">
                    <label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
                    {{ form.email }}
                    {{ form.email.errors }}
                </div>

                <button type="submit">Отправить ссылку</button>
            </form>

            <p class="alt-link"><a href="{% url 'login' %}">Вернуться ко входу</a></p>
        </div>
    </main>
</body>
</html>
