<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Happy Ice Cream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #142028;
            --muted: #5a6b73;
            --accent: #ff5c7a;
            --accent-deep: #e83d5f;
            --bg: #e9f1f4;
            --bg-warm: #f4eef0;
            --field: #ffffff;
            --ring: rgba(20, 32, 40, 0.14);
            --danger: #c62828;
            --shadow: 0 1px 2px rgba(20, 32, 40, 0.05), 0 10px 28px rgba(20, 32, 40, 0.06);
            --radius: 0.28rem;
            --radius-lg: 0.4rem;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100%;
            margin: 0;
        }

        body {
            font-family: "DM Sans", sans-serif;
            color: var(--ink);
            background:
                linear-gradient(165deg, var(--bg) 0%, #eef3f5 42%, var(--bg-warm) 100%);
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
        }

        .page-inner {
            width: min(100%, 28rem);
            animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .brand {
            margin: 0;
            font-family: Sora, sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: -0.04em;
            line-height: 0.95;
            text-align: center;
        }

        .brand a {
            color: inherit;
            text-decoration: none;
        }

        .tagline {
            margin: 0.75rem 0 1.5rem;
            color: var(--muted);
            font-size: 1.05rem;
            text-align: center;
        }

        .login-form {
            display: grid;
            gap: 0.9rem;
        }

        .field {
            display: grid;
            gap: 0.35rem;
            text-align: left;
        }

        .field label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .field input {
            width: 100%;
            height: 3rem;
            padding: 0 0.95rem;
            border: 1px solid var(--ring);
            border-radius: var(--radius);
            background: var(--field);
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow);
            color: var(--ink);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 160ms ease;
        }

        .field input:focus {
            border-color: var(--accent);
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 3rem;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 0.35rem;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.35rem;
            height: 2.35rem;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: var(--radius);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            box-shadow: none;
        }

        .password-toggle:hover,
        .password-toggle:focus-visible {
            color: var(--ink);
            background: rgba(20, 32, 40, 0.06);
            outline: none;
        }

        .password-toggle svg {
            width: 1.15rem;
            height: 1.15rem;
            display: block;
        }

        .password-toggle .icon-hide {
            display: none;
        }

        .password-toggle.is-visible .icon-show {
            display: none;
        }

        .password-toggle.is-visible .icon-hide {
            display: block;
        }

        .errorlist {
            margin: 0;
            padding: 0;
            list-style: none;
            color: var(--danger);
            font-size: 0.85rem;
        }

        .forgot-link {
            margin: -0.35rem 0 0;
            text-align: right;
            font-size: 0.9rem;
        }

        .forgot-link a {
            color: var(--accent-deep);
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .login-form > button[type="submit"] {
            margin-top: 0.35rem;
            height: 3.25rem;
            border: 0;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            font-family: Sora, sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: background 160ms ease;
        }

        .login-form > button[type="submit"]:hover {
            background: var(--accent-deep);
        }

        .alt-link {
            margin-top: 1rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .alt-link a {
            color: var(--accent-deep);
            font-weight: 600;
            text-decoration: none;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(1.25rem); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>
    <main class="page">
        <div class="page-inner">
            <h1 class="brand"><a href="{% url 'landing' %}">Happy Ice Cream</a></h1>
            <p class="tagline">Вход в аккаунт</p>

            <form class="login-form" method="post" novalidate>
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <div class="non-field-errors">{{ form.non_field_errors }}</div>
                {% endif %}

                <div class="field">
                    <label for="{{ form.username.id_for_label }}">Email</label>
                    {{ form.username }}
                    {{ form.username.errors }}
                </div>

                <div class="field">
                    <label for="{{ form.password.id_for_label }}">Пароль</label>
                    <div class="password-field">
                        {{ form.password }}
                        <button
                            type="button"
                            class="password-toggle"
                            aria-label="Показать пароль"
                            aria-pressed="false"
                        >
                            <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 10.6a2 3 0 0 0 2.8 2.8"/>
                                <path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.4 18.4 0 0 1-3.2 4.4"/>
                                <path d="M6.1 6.1C4 7.8 2.5 10.2 2 12c0 0 3.5 7 10 7a10.3 10.3 0 0 0 4.3-.9"/>
                            </svg>
                        </button>
                    </div>
                    {{ form.password.errors }}
                </div>

                <p class="forgot-link">
                    <a href="{% url 'forgot_password' %}">Забыли пароль?</a>
                </p>

                <button type="submit">Войти</button>
            </form>

            <p class="alt-link">Нет аккаунта? <a href="{% url 'signup' %}">Регистрация</a></p>
        </div>
    </main>
    <script>
        (function () {
            document.querySelectorAll('.password-toggle').forEach((toggle) => {
                const input = toggle.closest('.password-field')?.querySelector('input');
                if (!input) {
                    return;
                }
                toggle.addEventListener('click', () => {
                    const showing = input.type === 'text';
                    input.type = showing ? 'password' : 'text';
                    toggle.classList.toggle('is-visible', !showing);
                    toggle.setAttribute('aria-pressed', String(!showing));
                    toggle.setAttribute(
                        'aria-label',
                        showing ? 'Показать пароль' : 'Скрыть пароль'
                    );
                });
            });
        })();
    </script>
</body>
</html>
