{% extends "admin/index.html" %}

{% block content %}
<form method="post" action="{% url 'admin:pick_random_winner' %}" style="margin-bottom: 0.75rem;">
    {% csrf_token %}
    <button
        type="submit"
        class="button"
        style="
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.55rem 1.25rem;
            min-width: 14rem;
            cursor: pointer;
        "
    >
        Выбрать победителя
    </button>
</form>

<form
    method="post"
    action="{% url 'admin:generate_promocodes' %}"
    style="
        margin-bottom: 1.25rem;
        display: flex;
        flex-wrap: nowrap;
        gap: 0.5rem;
        align-items: center;
    "
>
    {% csrf_token %}
    <label for="id_count" style="font-weight: 600; white-space: nowrap;">
        Количество промокодов
    </label>
    <input
        id="id_count"
        type="number"
        name="count"
        min="1"
        max="5000000"
        value="1500000"
        required
        style="
            width: 8.5rem;
            padding: 0.45rem 0.6rem;
            font-size: 0.95rem;
        "
    >
    <button
        type="submit"
        class="button"
        style="
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.55rem 1.1rem;
            cursor: pointer;
            white-space: nowrap;
        "
    >
        Сгенерировать
    </button>
</form>

{{ block.super }}
{% endblock %}
