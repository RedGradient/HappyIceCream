{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<style>
    .analytics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
        gap: 1rem;
        margin: 0 0 1.5rem;
    }

    .analytics-card {
        margin: 0;
        padding: 1rem 1.1rem;
        background: var(--body-bg, #fff);
        border: 1px solid var(--hairline-color, #e8e8e8);
        border-radius: 6px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .analytics-card__label {
        margin: 0 0 0.45rem;
        color: var(--body-quiet-color, #666);
        font-size: 0.8125rem;
        font-weight: 600;
        line-height: 1.35;
    }

    .analytics-card__value {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 700;
        line-height: 1.2;
        color: var(--body-fg, #333);
    }

    .analytics-card__value--sm {
        font-size: 1.15rem;
    }

    .analytics-section {
        margin: 0 0 0.75rem;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--body-quiet-color, #666);
    }

    .analytics-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin: 0 0 1.25rem;
    }

    .analytics-toolbar .button,
    .analytics-toolbar a.button:link,
    .analytics-toolbar a.button:visited,
    .analytics-toolbar a.button:hover,
    .analytics-toolbar a.button:focus {
        padding: 0.55rem 1.15rem;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.2;
        text-decoration: none;
    }
</style>

<div class="analytics-toolbar">
    <a class="button" href="{% url 'admin:metrics_export_excel' %}">Выгрузить в Excel</a>
</div>

{% for section in sections %}
    <h2 class="analytics-section">{{ section.title }}</h2>
    <div class="analytics-grid">
        {% for item in section.items %}
            <div class="analytics-card">
                <p class="analytics-card__label">{{ item.label }}</p>
                <p class="analytics-card__value{% if item.compact %} analytics-card__value--sm{% endif %}">
                    {{ item.value }}
                </p>
            </div>
        {% endfor %}
    </div>
{% endfor %}
{% endblock %}
